[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "pozor-me"
version = "0.2.0"
description = "Локальный Telegram-бот для контекстной прожарки в группе"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiogram>=3.22,<4",
    "aiosqlite>=0.21,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "typer>=0.16,<1",
    "telethon>=1.42,<2",
    "qrcode>=8.2,<9",
    "ijson>=3.4,<4",
]

[project.optional-dependencies]
imports = ["ijson>=3.4,<4"]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "poethepoet>=0.37,<1", "import-linter>=2.5,<3", "pytest-cov>=6,<8"]

[dependency-groups]
dev = ["mypy>=1.17,<2", "pytest>=8.4,<9", "pytest-asyncio>=1.1,<2", "ruff>=0.12,<1", "poethepoet>=0.37,<1", "import-linter>=2.5,<3", "pytest-cov>=6,<8"]

[tool.uv]
default-groups = ["dev"]

[tool.poe.tasks]
lint = "python -m ruff check src tests"
types = "python -m mypy src/pozor"
imports = "lint-imports"
test = "python -m pytest -q --cov=pozor.core --cov-fail-under=85"
fmt = "python -m ruff format src tests"
check = ["lint", "types", "imports", "test"]

[tool.importlinter]
root_package = "pozor"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core depends only on domain and ports"
type = "forbidden"
source_modules = ["pozor.core"]
forbidden_modules = ["pozor.infra", "pozor.presentation", "pozor.app", "pozor.storage", "pozor.config", "pozor.context", "pozor.llm", "aiogram", "telethon", "sqlite3", "httpx", "pydantic_settings", "os"]

[[tool.importlinter.contracts]]
name = "Infrastructure cannot depend on application or presentation"
type = "forbidden"
source_modules = ["pozor.infra"]
forbidden_modules = ["pozor.presentation", "pozor.app"]

[project.scripts]
pozor = "pozor.presentation.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pozor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pozor"]

[[tool.mypy.overrides]]
module = ["telethon.*", "qrcode.*"]
ignore_missing_imports = true
